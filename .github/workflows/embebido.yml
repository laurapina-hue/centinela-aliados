# Regenera js/embebido.js cuando cambian los datos o el contexto
name: Actualizar copia embebida

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "contexto/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embebido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node herramientas/generar-embebido.js
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add js/embebido.js
          git diff --cached --quiet || git commit -m "Actualiza copia embebida de datos y contexto"
          git push
